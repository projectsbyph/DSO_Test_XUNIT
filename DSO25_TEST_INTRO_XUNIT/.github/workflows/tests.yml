name: Run Unit tests
on:
  push:
    branches:
      - main

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
        - name: checkout repository
          uses: actions/checkout@v4

        - name: Set up .NET
          uses: actions/setup-dotnet@v4
          with:
            dotnet-version: '10.x'

        - name: restore dependencies
          run: dotnet restore

        - name: Run unit tests
          run: dotnet test 